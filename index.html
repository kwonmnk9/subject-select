<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027학년도 IB 선택과목 신청 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-md py-6 px-4">
        <div class="max-w-xl mx-auto text-center">
            <h1 class="text-2xl font-bold">2027학년도 IB 선택과목 신청 시스템</h1>
            <p class="text-indigo-50 text-sm mt-1">계열별 규칙 및 전 그룹(1~5) 포함 여부를 검증하고 제출합니다.</p>
        </div>
    </header>

    <main class="flex-grow max-w-xl w-full mx-auto p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">

            <!-- STEP 1: 학번 이름 작성 -->
            <section id="step-1" class="space-y-4">
                <h2 class="text-lg font-bold text-slate-800 border-b pb-2">1. 학생 정보 입력</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">이름</label>
                        <input type="text" id="input-name" placeholder="성명을 입력하세요" class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-200">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">학번</label>
                        <input type="text" id="input-id" placeholder="예: 1501" class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-200">
                    </div>
                </div>
                <button type="button" onclick="goToStep2()" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-medium text-sm hover:bg-indigo-700 transition-colors shadow-sm cursor-pointer">
                    다음 단계 (계열 선택) →
                </button>
            </section>

            <!-- STEP 2: 인문계열, 이공계열 선택 -->
            <section id="step-2" class="hidden space-y-4">
                <h2 class="text-lg font-bold text-slate-800 border-b pb-2">2. 계열 선택</h2>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="selectTrack('인문계열')" id="btn-humanities" class="p-4 rounded-xl border-2 text-left transition-all border-slate-300 hover:border-indigo-400">
                        <div class="font-bold text-slate-900 text-base">인문계열</div>
                        <p class="text-sm text-slate-600 mt-1">• 국어 HL (고정)<br>• 수학 SL (고정)</p>
                    </button>
                    <button type="button" onclick="selectTrack('이공계열')" id="btn-science" class="p-4 rounded-xl border-2 text-left transition-all border-slate-300 hover:border-indigo-400">
                        <div class="font-bold text-slate-900 text-base">이공계열</div>
                        <p class="text-sm text-slate-600 mt-1">• 수학 HL (고정)<br>• 영어 SL (고정)</p>
                    </button>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="showStep(1)" class="px-4 py-2.5 rounded-xl border-2 border-slate-300 text-sm font-semibold text-slate-700 hover:bg-slate-100">← 이전</button>
                    <button type="button" onclick="goToStep3()" class="flex-grow py-3 rounded-xl bg-indigo-600 text-white font-medium text-sm hover:bg-indigo-700 transition-colors cursor-pointer">다음 단계 (교과 선택) →</button>
                </div>
            </section>

            <!-- STEP 3 & 4: HL 및 SL 교과 선택 -->
            <section id="step-3-4" class="hidden space-y-4">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="text-base sm:text-lg font-bold text-slate-900">3 & 4. 교과 선택 (HL 3, SL 3, 그룹 1~5 필수)</h2>
                    <span id="counter-badge" class="text-sm px-3 py-1 rounded-full font-bold bg-amber-100 text-amber-900 whitespace-nowrap">HL: 0/3 | SL: 0/3</span>
                </div>
                
                <p class="text-sm text-slate-600" id="guide-text">그룹 1~5에서 최소 1과목 이상이 포함되도록 선택하세요.</p>

                <div id="subject-selection-container" class="space-y-3">
                    <!-- 동적 생성 영역 -->
                </div>

                <div id="error-msg" class="text-sm text-rose-700 font-semibold min-h-[1.25rem]"></div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="showStep(2)" class="px-4 py-2.5 rounded-xl border-2 border-slate-300 text-sm font-semibold text-slate-700 hover:bg-slate-100">← 이전</button>
                    <button type="button" id="btn-to-submit" onclick="goToStep5()" disabled class="flex-grow py-3 rounded-xl bg-slate-300 text-slate-600 font-medium text-sm cursor-not-allowed transition-colors">
                        선택 결과 확인 및 제출 →
                    </button>
                </div>
            </section>

            <!-- STEP 5: 선택한 내용을 구글 폼으로 전송 -->
            <section id="step-5" class="hidden space-y-4">
                <h2 class="text-lg font-bold text-slate-800 border-b pb-2">5. 선택 결과 확인 및 구글 폼 전송</h2>
                
                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 space-y-2">
                    <div class="text-sm font-bold text-emerald-900">✓ 조건 검증 완료된 선택 내역</div>
                    <div id="summary-box" class="text-sm text-slate-800 space-y-1.5"></div>
                </div>

                <!-- CORS 우회를 위한 숨겨진 iframe -->
                <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(isSubmitted){alert('과목 선택 결과가 구글 폼으로 성공적으로 전송되었습니다!'); location.reload();}"></iframe>

                <!-- 실제 구글 폼으로 쏘아주는 form (CORS 제한 없음) -->
                <form id="google-form" action="https://docs.google.com/forms/d/e/1FAIpQLSecp1ru9OyMo2-3HeZbqzMxRheQlzb6zZY-jtpbKaHvMahLvA/formResponse" target="hidden_iframe" method="POST" onsubmit="fillFormFields(); isSubmitted=true;" class="space-y-3">
                    <input type="hidden" id="form-name" name="entry.1049955577">
                    <input type="hidden" id="form-id" name="entry.1806957784">
                    <input type="hidden" id="form-track" name="entry.510391112">
                    <div id="form-checkbox-fields"></div>

                    <div class="flex gap-2 pt-2">
                        <button type="button" onclick="showStep(3)" class="px-4 py-2.5 rounded-xl border-2 border-slate-300 text-sm font-semibold text-slate-700 hover:bg-slate-100">← 수정하기</button>
                        <button type="submit" class="flex-grow py-3 rounded-xl bg-indigo-600 text-white font-medium text-sm hover:bg-indigo-700 transition-colors shadow-sm cursor-pointer">
                            구글 폼으로 전송하기
                        </button>
                    </div>
                </form>
            </section>

        </div>
    </main>

    <footer class="text-center py-5 text-sm font-medium text-slate-600">
        서야고등학교 미래교육부
    </footer>

    <script>
        let studentName = '';
        let studentId = '';
        let selectedTrack = ''; 
        let isSubmitted = false;

        let selections = {
            kor: '', eng: '', econ: '', hist: '', phys: '', chem: '', bio: '', math: ''
        };

        const subjectMeta = {
            kor: { name: 'IB 국어', group: 1 },
            eng: { name: 'IB 영어', group: 2 },
            econ: { name: 'IB 경제', group: 3 },
            hist: { name: 'IB 역사', group: 3 },
            phys: { name: 'IB 물리', group: 4 },
            chem: { name: 'IB 화학', group: 4 },
            bio: { name: 'IB 생물', group: 4 },
            math: { name: 'IB 수학: 분석과 접근', group: 5 }
        };

        function showStep(step) {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3-4').classList.add('hidden');
            document.getElementById('step-5').classList.add('hidden');

            if (step === 1) document.getElementById('step-1').classList.remove('hidden');
            if (step === 2) document.getElementById('step-2').classList.remove('hidden');
            if (step === 3) {
                document.getElementById('step-3-4').classList.remove('hidden');
                renderSubjectSelection();
            }
            if (step === 5) {
                document.getElementById('step-5').classList.remove('hidden');
                renderSummary();
            }
        }

        function goToStep2() {
            studentName = document.getElementById('input-name').value.trim();
            studentId = document.getElementById('input-id').value.trim();
            if (!studentName || !studentId) {
                alert('이름과 학번을 모두 입력해주세요.');
                return;
            }
            showStep(2);
        }

        function selectTrack(track) {
            selectedTrack = track;
            if (track === '인문계열') {
                document.getElementById('btn-humanities').className = "p-4 rounded-xl border-2 text-left transition-all border-indigo-600 bg-indigo-100 shadow-md ring-2 ring-indigo-200";
                document.getElementById('btn-science').className = "p-4 rounded-xl border-2 text-left transition-all border-slate-300 hover:border-indigo-400";
                selections = { kor: 'HL', eng: '', econ: '', hist: '', phys: '', chem: '', bio: '', math: 'SL' };
            } else {
                document.getElementById('btn-science').className = "p-4 rounded-xl border-2 text-left transition-all border-indigo-600 bg-indigo-100 shadow-md ring-2 ring-indigo-200";
                document.getElementById('btn-humanities').className = "p-4 rounded-xl border-2 text-left transition-all border-slate-300 hover:border-indigo-400";
                selections = { kor: '', eng: 'SL', econ: '', hist: '', phys: '', chem: '', bio: '', math: 'HL' };
            }
        }

        function goToStep3() {
            if (!selectedTrack) {
                alert('계열을 선택해주세요.');
                return;
            }
            showStep(3);
        }

        function renderSubjectSelection() {
            const container = document.getElementById('subject-selection-container');
            container.innerHTML = '';

            const subjectList = [
                { id: 'kor', name: 'IB 국어 (Group 1)' },
                { id: 'eng', name: 'IB 영어 (Group 2)' },
                { id: 'econ', name: 'IB 경제 (Group 3)' },
                { id: 'hist', name: 'IB 역사 (Group 3)' },
                { id: 'phys', name: 'IB 물리 (Group 4)' },
                { id: 'chem', name: 'IB 화학 (Group 4)' },
                { id: 'bio', name: 'IB 생물 (Group 4)' },
                { id: 'math', name: 'IB 수학: 분석과 접근 (Group 5)' }
            ];

            subjectList.forEach(subj => {
                const currentVal = selections[subj.id];
                let isFixed = false;
                let fixedBadge = '';

                if (selectedTrack === '인문계열') {
                    if (subj.id === 'kor') { isFixed = true; fixedBadge = '<span class="px-3 py-1.5 rounded-lg bg-purple-100 text-purple-800 font-bold text-sm">국어 HL (자동고정)</span>'; }
                    if (subj.id === 'math') { isFixed = true; fixedBadge = '<span class="px-3 py-1.5 rounded-lg bg-slate-200 text-slate-800 font-bold text-sm">수학 SL (자동고정)</span>'; }
                } else {
                    if (subj.id === 'math') { isFixed = true; fixedBadge = '<span class="px-3 py-1.5 rounded-lg bg-purple-100 text-purple-800 font-bold text-sm">수학 HL (자동고정)</span>'; }
                    if (subj.id === 'eng') { isFixed = true; fixedBadge = '<span class="px-3 py-1.5 rounded-lg bg-slate-200 text-slate-800 font-bold text-sm">영어 SL (자동고정)</span>'; }
                }

                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3.5 rounded-xl border-2 border-slate-200 bg-white text-base";

                let controlHtml = '';
                if (isFixed) {
                    controlHtml = fixedBadge;
                } else {
                    let canSelectHL = false;
                    let canSelectSL = false;

                    if (selectedTrack === '인문계열') {
                        if (['eng', 'hist', 'econ'].includes(subj.id)) canSelectHL = true;
                        if (['phys', 'chem', 'bio', 'eng', 'hist', 'econ'].includes(subj.id)) canSelectSL = true;
                    } else {
                        if (['phys', 'chem', 'bio', 'kor'].includes(subj.id)) canSelectHL = true;
                        if (['phys', 'chem', 'bio', 'kor', 'hist', 'econ'].includes(subj.id)) canSelectSL = true;
                    }

                    let hlBtnState = currentVal === 'HL' ? 'bg-indigo-600 text-white font-bold shadow' : 'bg-white border-2 border-slate-400 text-slate-700 hover:bg-slate-100';
                    let slBtnState = currentVal === 'SL' ? 'bg-indigo-600 text-white font-bold shadow' : 'bg-white border-2 border-slate-400 text-slate-700 hover:bg-slate-100';

                    let hlDisabled = !canSelectHL ? 'opacity-30 cursor-not-allowed' : '';
                    let slDisabled = !canSelectSL ? 'opacity-30 cursor-not-allowed' : '';

                    controlHtml = `
                        <div class="flex gap-1.5 items-center">
                            <button type="button" ${!canSelectHL ? 'disabled' : ''} onclick="setSubjectLevel('${subj.id}', 'HL')" class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all ${hlBtnState} ${hlDisabled}">HL</button>
                            <button type="button" ${!canSelectSL ? 'disabled' : ''} onclick="setSubjectLevel('${subj.id}', 'SL')" class="px-4 py-1.5 rounded-lg text-sm font-bold transition-all ${slBtnState} ${slDisabled}">SL</button>
                            ${currentVal ? `<button type="button" onclick="setSubjectLevel('${subj.id}', '')" class="text-sm text-rose-600 ml-1 font-semibold hover:underline">해제</button>` : ''}
                        </div>
                    `;
                }

                div.innerHTML = `<span class="font-semibold text-slate-900">${subj.name}</span>${controlHtml}`;
                container.appendChild(div);
            });

            validateRules();
        }

        function setSubjectLevel(id, level) {
            selections[id] = level;
            renderSubjectSelection();
        }

        function validateRules() {
            let hlCount = 0;
            let slCount = 0;
            let selectedCount = 0;
            let groupsCovered = new Set();

            for (let key in selections) {
                if (selections[key] !== '') {
                    selectedCount++;
                    groupsCovered.add(subjectMeta[key].group);
                    if (selections[key] === 'HL') hlCount++;
                    if (selections[key] === 'SL') slCount++;
                }
            }

            document.getElementById('counter-badge').innerText = `HL: ${hlCount}/3 | SL: ${slCount}/3 | 그룹: ${groupsCovered.size}/5`;

            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.getElementById('btn-to-submit');

            let isValid = true;
            let errorMessage = '';

            if (selectedCount !== 6) {
                isValid = false;
                errorMessage = `총 6과목을 선택해야 합니다. (현재 선택된 과목: ${selectedCount}개)`;
            } else if (hlCount !== 3 || slCount !== 3) {
                isValid = false;
                errorMessage = "HL 3과목, SL 3과목을 정확히 균형 있게 선택해야 합니다.";
            } else if (groupsCovered.size < 5) {
                isValid = false;
                errorMessage = "Group 1부터 Group 5까지의 모든 그룹에서 최소 1과목 이상을 포함해야 합니다.";
            } else if (selectedTrack === '인문계열') {
                let humHLCount = ['eng', 'hist', 'econ'].filter(k => selections[k] === 'HL').length;
                let humSLCount = ['phys', 'chem', 'bio', 'eng', 'hist', 'econ'].filter(k => selections[k] === 'SL').length;
                
                if (humHLCount !== 2 || humSLCount !== 2) {
                    isValid = false;
                    errorMessage = "인문계열은 HL(영어, 역사, 경제 중 2개)과 SL(2개) 조건을 충족해야 합니다.";
                }
            } else if (selectedTrack === '이공계열') {
                let sciHLCount = ['phys', 'chem', 'bio', 'kor'].filter(k => selections[k] === 'HL').length;
                let sciSLCount = ['phys', 'chem', 'bio', 'kor', 'hist', 'econ'].filter(k => selections[k] === 'SL').length;

                if (sciHLCount !== 2 || sciSLCount !== 2) {
                    isValid = false;
                    errorMessage = "이공계열은 추가 HL 2개와 SL 2개 조건을 충족해야 합니다.";
                }
            }

            if (isValid) {
                document.getElementById('counter-badge').className = "text-sm px-3 py-1 rounded-full font-bold bg-emerald-100 text-emerald-900 whitespace-nowrap";
                errorMsg.innerText = "";
                submitBtn.disabled = false;
                submitBtn.className = "flex-grow py-3 rounded-xl bg-indigo-600 text-white font-medium text-sm hover:bg-indigo-700 transition-colors shadow-sm cursor-pointer";
            } else {
                document.getElementById('counter-badge').className = "text-sm px-3 py-1 rounded-full font-bold bg-amber-100 text-amber-900 whitespace-nowrap";
                errorMsg.innerText = errorMessage;
                submitBtn.disabled = true;
                submitBtn.className = "flex-grow py-3 rounded-xl bg-slate-300 text-slate-600 font-medium text-sm cursor-not-allowed";
            }
        }

        function goToStep5() {
            showStep(5);
        }

        // 구글 폼 설정값 (폼의 실제 선택지 문구와 정확히 일치해야 함)
        const ENTRY_HL = 'entry.1577406468';
        const ENTRY_SL = 'entry.2029472327';
        const formSubjectLabel = {
            kor: '국어', eng: '영어', econ: '경제', hist: '역사',
            phys: '물리', chem: '화학', bio: '생명', math: '수학'
        };
        const formTrackLabel = { '인문계열': '인문계열', '이공계열': '자연계열' };

        function fillFormFields() {
            document.getElementById('form-name').value = studentName;
            document.getElementById('form-id').value = studentId;
            document.getElementById('form-track').value = formTrackLabel[selectedTrack] || selectedTrack;

            // 체크박스 문항: 과목마다 같은 entry 이름으로 input을 하나씩 만들어 전송
            const holder = document.getElementById('form-checkbox-fields');
            holder.innerHTML = '';
            for (let key in selections) {
                const level = selections[key];
                if (level !== 'HL' && level !== 'SL') continue;
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = level === 'HL' ? ENTRY_HL : ENTRY_SL;
                input.value = formSubjectLabel[key];
                holder.appendChild(input);
            }
        }

        function renderSummary() {
            const box = document.getElementById('summary-box');
            box.innerHTML = `
                <div><strong>학생 정보:</strong> ${studentName} (${studentId})</div>
                <div><strong>선택 계열:</strong> ${selectedTrack}</div>
            `;

            let hlList = [];
            let slList = [];

            for (let key in selections) {
                if (selections[key] === 'HL') hlList.push(subjectMeta[key].name);
                if (selections[key] === 'SL') slList.push(subjectMeta[key].name);
            }

            box.innerHTML += `<div><strong>HL 과목 (3개):</strong> ${hlList.join(', ')}</div>`;
            box.innerHTML += `<div><strong>SL 과목 (3개):</strong> ${slList.join(', ')}</div>`;

            fillFormFields();
        }
    </script>
</body>
</html>
